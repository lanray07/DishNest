import groovy.json.JsonOutput
import java.security.MessageDigest

gradle.projectsEvaluated {
    def app = rootProject.project(':app')
    app.tasks.register('writeRuntimeInventory') {
        doLast {
            def records = app.configurations.releaseRuntimeClasspath.resolvedConfiguration.resolvedArtifacts.collect { artifact ->
                def id = artifact.moduleVersion.id
                [group: id.group, name: id.name, version: id.version, file: artifact.file.name,
                 sha256: MessageDigest.getInstance('SHA-256').digest(artifact.file.bytes).encodeHex().toString()]
            }.sort { "${it.group}:${it.name}:${it.version}" }
            def output = new File(rootProject.projectDir, 'artifacts/runtime-components.json')
            output.parentFile.mkdirs()
            output.text = JsonOutput.prettyPrint(JsonOutput.toJson(records))
        }
    }
}
